<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PUBG Radar</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0a0a; color: #eee; font-family: monospace; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  #topbar { display: flex; align-items: center; gap: 12px; padding: 6px 12px; background: #111; border-bottom: 1px solid #222; flex-shrink: 0; }
  #topbar h1 { font-size: 13px; color: #aaa; letter-spacing: 2px; text-transform: uppercase; }
  #status { font-size: 11px; padding: 2px 8px; border-radius: 3px; background: #333; }
  #status.ok { background: #1a3a1a; color: #4f4; }
  #status.err { background: #3a1a1a; color: #f44; }
  #controls { display: flex; gap: 8px; margin-left: auto; align-items: center; }
  label { font-size: 11px; color: #888; }
  input[type=text] { background: #1a1a1a; border: 1px solid #333; color: #eee; padding: 2px 6px; font-size: 11px; width: 120px; border-radius: 3px; }
  input[type=range] { width: 80px; accent-color: #4af; }
  button { background: #1a2a3a; border: 1px solid #4af; color: #4af; font-size: 11px; padding: 3px 10px; border-radius: 3px; cursor: pointer; }
  button:hover { background: #243c52; }
  #wrap { flex: 1; display: flex; overflow: hidden; }
  canvas { display: block; background: #0d0d0d; cursor: crosshair; }
  #sidebar { width: 200px; flex-shrink: 0; background: #111; border-left: 1px solid #1a1a1a; overflow-y: auto; font-size: 11px; }
  #sidebar h2 { font-size: 10px; color: #555; text-transform: uppercase; letter-spacing: 1px; padding: 8px; border-bottom: 1px solid #1a1a1a; }
  .player-row { padding: 5px 8px; border-bottom: 1px solid #151515; display: flex; justify-content: space-between; gap: 4px; }
  .player-row .name { color: #bbb; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100px; }
  .player-row .dist { color: #888; flex-shrink: 0; }
  .dead { opacity: 0.3; }
</style>
</head>
<body>
<div id="topbar">
  <h1>&#x2022; PUBG Radar</h1>
  <span id="status">Disconnected</span>
  <div id="controls">
    <label>Broker <input type="text" id="broker" value="ws://127.0.0.1:9001"></label>
    <label>Topic <input type="text" id="topic" value="pubg/radar"></label>
    <button id="btnConnect">Connect</button>
    <label>Zoom <input type="range" id="zoom" min="1" max="20" step="0.5" value="5"></label>
    <label><input type="checkbox" id="chkNames" checked> Names</label>
    <label><input type="checkbox" id="chkDead"> Dead</label>
  </div>
</div>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="sidebar"><h2>Players</h2><div id="playerList"></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.3.4/mqtt.min.js"></script>
<script>
// ── state ──────────────────────────────────────────────────────────────────
let client = null;
let players = [];
let cam = { x: 0, y: 0, z: 0 };
let zoom = 5;
let dragX = 0, dragY = 0;
let dragging = false, dragStart = null;
let showNames = true, showDead = false;

// team colours (indexed by teamId % colours.length)
const COLOURS = [
  '#f7f813','#fa7f49','#5ac6e3','#5abd4d','#e1637b','#7381a8',
  '#9f7e69','#ff86c8','#d2e0bf','#9a348e','#62929e','#e2d6ef',
  '#04a777','#7371fc','#ff00ff','#5d2e8c','#00ff00','#0000ff',
  '#ffa500','#800080','#ffc0cb','#808000','#ffd700','#4b0082',
  '#00bfff','#ff69b4','#8b4513','#dc143c','#00ff7f','#00fa9a',
];

function teamColor(id) { return COLOURS[Math.abs(id) % COLOURS.length]; }

// ── canvas ─────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  const wrap = document.getElementById('wrap');
  canvas.width  = wrap.clientWidth - 200;
  canvas.height = wrap.clientHeight;
}
resize();
window.addEventListener('resize', resize);

// drag
canvas.addEventListener('mousedown', e => { dragging = true; dragStart = {x: e.clientX - dragX, y: e.clientY - dragY}; });
window.addEventListener('mousemove', e => { if (!dragging) return; dragX = e.clientX - dragStart.x; dragY = e.clientY - dragStart.y; });
window.addEventListener('mouseup',   () => dragging = false);
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  zoom = Math.max(1, Math.min(20, zoom - e.deltaY * 0.01));
  document.getElementById('zoom').value = zoom;
}, { passive: false });

document.getElementById('zoom').addEventListener('input', e => { zoom = +e.target.value; });
document.getElementById('chkNames').addEventListener('change', e => { showNames = e.target.checked; });
document.getElementById('chkDead').addEventListener('change',  e => { showDead  = e.target.checked; });

// world → screen: camera is centre; zoom is cm-per-pixel inverse
function w2s(wx, wy) {
  const cx = canvas.width  / 2 + dragX;
  const cy = canvas.height / 2 + dragY;
  return {
    sx: cx + (wx - cam.x) / 100 * zoom,
    sy: cy - (wy - cam.y) / 100 * zoom   // Y flipped: game Y+ is north
  };
}

function draw() {
  requestAnimationFrame(draw);
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // grid
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 1;
  const step = 10000; // 100m grid in UU
  const origin = w2s(0, 0);
  // just a simple cross at world origin
  ctx.beginPath();
  ctx.moveTo(0, origin.sy); ctx.lineTo(canvas.width, origin.sy);
  ctx.moveTo(origin.sx, 0); ctx.lineTo(origin.sx, canvas.height);
  ctx.stroke();

  // camera dot (self)
  const cs = w2s(cam.x, cam.y);
  ctx.beginPath(); ctx.arc(cs.sx, cs.sy, 5, 0, Math.PI*2);
  ctx.fillStyle = '#fff'; ctx.fill();
  ctx.fillStyle = '#aaa'; ctx.font = '10px monospace';
  ctx.fillText('YOU', cs.sx + 7, cs.sy + 4);

  // players
  for (const p of players) {
    if (p.isDead && !showDead) continue;
    const { sx, sy } = w2s(p.x, p.y);
    if (sx < -20 || sx > canvas.width+20 || sy < -20 || sy > canvas.height+20) continue;

    const col = p.isDead ? '#444' : teamColor(p.teamId);
    ctx.beginPath(); ctx.arc(sx, sy, 5, 0, Math.PI*2);
    ctx.fillStyle = col; ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke();

    if (showNames && p.name) {
      ctx.fillStyle = p.isDead ? '#555' : col;
      ctx.font = '10px monospace';
      ctx.fillText(p.name, sx + 7, sy + 4);
    }
  }
}
draw();

// ── sidebar ────────────────────────────────────────────────────────────────
function updateSidebar() {
  const list = document.getElementById('playerList');
  const sorted = [...players].sort((a, b) => a.dist - b.dist);
  list.innerHTML = sorted.map(p => `
    <div class="player-row ${p.isDead ? 'dead' : ''}">
      <span class="name" style="color:${teamColor(p.teamId)}" title="${p.name}">${p.name || '—'}</span>
      <span class="dist">${p.dist.toFixed(0)}m</span>
    </div>`).join('');
}

// ── MQTT ───────────────────────────────────────────────────────────────────
const statusEl = document.getElementById('status');

function setStatus(text, ok) {
  statusEl.textContent = text;
  statusEl.className = ok ? 'ok' : (ok === false ? 'err' : '');
}

function connect() {
  if (client) { try { client.end(true); } catch(_){} }
  const broker = document.getElementById('broker').value.trim();
  const topic  = document.getElementById('topic').value.trim();
  setStatus('Connecting…');

  client = mqtt.connect(broker, { reconnectPeriod: 3000, connectTimeout: 8000 });

  client.on('connect', () => {
    setStatus('Connected', true);
    client.subscribe(topic, err => { if (err) setStatus('Subscribe failed', false); });
  });

  client.on('error', err => setStatus('Error: ' + err.message, false));
  client.on('close', ()  => setStatus('Disconnected', false));

  client.on('message', (t, buf) => {
    try {
      const data = JSON.parse(buf.toString());
      if (data.cam) { cam.x = data.cam.x; cam.y = data.cam.y; cam.z = data.cam.z; }
      if (Array.isArray(data.players)) {
        players = data.players;
        updateSidebar();
      }
    } catch(_) {}
  });
}

document.getElementById('btnConnect').addEventListener('click', connect);
// auto-connect on load
connect();
</script>
</body>
</html>
